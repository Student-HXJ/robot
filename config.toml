# ============================================================ #
#  冒险岛机器人全局配置（TOML）
#
#  所有可调参数集中在这里，无需改动任何代码 / exe。
#  本文件必须与 exe（或 config.py）放在同一目录下；
#  若不存在，程序启动时会自动生成一份默认配置。
#
#  修改后重新启动程序即生效。
# ============================================================ #

# ------------------------------------------------------------------ #
#  [path] 路径
# ------------------------------------------------------------------ #

[path]

# 怪物模板目录：monster/ 下按怪物种类分子文件夹存放模板（如 monster/zhu）。
# 相对路径基于程序所在目录解析（exe 方式为 exe 所在目录，脚本方式为项目根目录）。
monster_dir = "monster"
# 玩家模板目录
player_dir = "player"

# ------------------------------------------------------------------ #
#  [detect] 截图区域（检测条）
# ------------------------------------------------------------------ #

[detect]

# 检测区域：屏幕 2560x1600，游戏窗口全屏。
# 格式 [left, top, width, height]，取屏幕中心玩家附近的区域。
# 注：按「游戏窗口全屏 (0,0) 尺寸 2560x1600」玩家居中实测调整（估算，可再微调）。
detect_region = [600, 804, 1446, 158]

# 检测间隔（秒），0.03 ≈ 30fps
detect_interval = 0.03

# 检测区域左右各向内收缩的像素（缩小有效检测范围）
detect_side_margin = 100

# 怪物监控范围（紫色框）Y 轴容差：玩家水平线上下各保留的像素
monster_detect_y_tolerance = 50

# 窄条截图上下额外余量（像素），与 Y 容差共同决定窄条高度，
# 确保近身大怪物不会被截断。窄条高度 = (Y容差 + 此值) * 2
strip_y_pad = 80

# 玩家检测区域左右两边各保留的边距像素，避免贴边误匹配
player_detect_x_shrink = 20

# 玩家位置缓存有效期（秒）：玩家检测偶尔会失败（移动动画帧不匹配模板等），
# 失败时回退到上次成功检测到的位置，而非检测条中心，避免朝向/距离判断错乱。
# 超过该时长仍未检测到玩家，才认为位置不可信。
player_cache_ttl = 2.0

# 玩家居中校正：玩家 X 进入检测区域左/右区时，立即按住方向键回中到中区。
# 回中优先级高于"朝怪物移动/空闲随机移动"（只覆盖移动方向，不覆盖攻击），
# 防止玩家跑出检测框导致漏检或追怪越走越远。true 时启用。
keep_centered_enabled = true

# 启用居中校正的怪物分类（对应 --monster 指定的分类名 / monster/ 下的子目录名）。
# 例：["yezhu"] 表示只有打野猪（--monster yezhu）时才启用检测框五区回中，
# 其他分类保持"追怪为主 + 卡住反向脱困"；留空 [] 表示全部关闭。
keep_centered_enabled_categories = ["yezhu"]

# 中间区域宽度（占检测区域宽度的比例）：玩家在中间区域（检测框中间这块）时
# 不做任何调整，只有进入最左侧或最右侧区域才回中。
# 默认 0.6 = 3/5：等价于把检测框平均分成 5 块（每块 1/5），中间 3 块
# （共 60% 宽度）内自由活动，只有进入最左块或最右块才往反方向回中。
# 调大该值 → 中间区域更宽，自由活动范围更大（更不容易被拉回，但更容易跑偏
# 到检测框边缘漏检）；调小 → 更严格地贴近中央。
keep_centered_middle_fraction = 0.6

# ------------------------------------------------------------------ #
#  [match] 模板匹配
# ------------------------------------------------------------------ #

[match]

# 怪物匹配阈值（TM_CCOEFF_NORMED，0~1，越高越严格）。
# 实测真实怪物的模板匹配分约 0.46~0.49，阈值设 0.5 会漏检，故降至 0.45。
# 若误检变多可适当回调。
match_threshold = 0.55

# 玩家匹配阈值（玩家模板更精确，阈值可更高）
player_match_threshold = 0.5

# 模板缩放比例列表：仅 1.0，保持比对图原始大小（不做比例缩放）。
# 若怪物在屏幕上的大小与模板差异较大导致漏检，可加回 1.5 等比例。
template_scales = [1.0]

# 非极大抑制距离（像素），小于此距离的命中合并为同一个
nms_distance = 30

# 怪物多帧确认距离（像素）：当前帧怪物与上一帧同一怪物（此距离内）才算可信。
# 需大于 nms_distance，因为角色移动时摄像机跟随滚动，静止怪物的屏幕坐标
# 也会每帧位移（实测 ~30px）。太小会漏确认，太大会放过闪烁噪声。
monster_confirm_distance = 45

# ------------------------------------------------------------------ #
#  [monster_filter] 怪物过滤
# ------------------------------------------------------------------ #

[monster_filter]

# 最小面积（像素²），小于此值的命中视为噪点过滤掉
monster_min_area = 1000

# 最低置信度，低于此值的命中过滤掉。
# 与 match_threshold 保持一致（0.45），否则通过匹配门槛的怪物会被二次过滤。
monster_confirm_score = 0.5

# ------------------------------------------------------------------ #
#  [attack] 攻击距离判定
# ------------------------------------------------------------------ #

[attack]

# 攻击半径（像素），决定监控紫框高度与攻击判定阈值
attack_radius = 50

# 攻击判定阈值（像素）= 攻击框宽度的一半（不再使用攻击框，直接比较 X 距离）。
# 实测 100px 会贴脸，故加大到 130px（玩家中心与怪物中心 X 距离），
# 让机器人在较舒适的距离出手。若出手打空可适当回调。
# 注意：默认值为 attack_radius + 50，若调整 attack_radius 请同步改这里。
attack_distance_threshold = 100

# 攻击中心相对玩家 X 的偏移（右偏，用于距离排序）
attack_center_offset = 20

# ------------------------------------------------------------------ #
#  [control_keys] 按键映射（功能控制键）
# ------------------------------------------------------------------ #

[control_keys]

# F9 键：启动/停止机器人
key_toggle_bot = "f9"
# F10 键：开启/关闭 HP/MP 监控 + 喂宠物
key_toggle_hpmp = "f10"
# F8 键：退出程序
key_quit = "f8"

# 独立检测 CLI（monster_detect.py）复用以上功能控制键：
# F9 开关检测、F8 退出（与主机器人一致，修改后同样生效）。

# ------------------------------------------------------------------ #
#  [action_keys] 按键映射（操作键名，传给 pydirectinput）
# ------------------------------------------------------------------ #

[action_keys]

key_attack = "x"      # 攻击键
key_pickup = "z"      # 捡东西键
key_feed_pet = "8"    # 喂食宠物快捷键
key_hp_potion = "9"   # 补血药水快捷键
key_mp_potion = "0"   # 补蓝药水快捷键
key_left = "left"     # 左方向键
key_right = "right"   # 右方向键

# ------------------------------------------------------------------ #
#  [operation] 操作参数（按键时长与随机抖动）
# ------------------------------------------------------------------ #

[operation]

# pydirectinput 内置的固定延迟（秒），置 0 消除，提高按键响应速度
pydirectinput_pause = 0

# 普通按键按下保持时间（秒）与其随机抖动（±秒）
press_delay = 0.01
press_jitter = 0.01

# 方向键单步按下保持时间（秒）与其抖动（±秒），越长移动越远
dir_hold = 0.3
dir_hold_jitter = 0.1

# 攻击间隔（秒）与其抖动（±秒）【预留参数，暂未使用】
attack_interval = 0.01
attack_jitter = 0.01

# 捡东西连按次数
pickup_count = 3
# 无怪物时捡东西的间隔（秒）
pickup_interval = 2.0

# 空闲无怪物时，按住方向键持续移动的随机切换间隔（秒，随机抖动）
idle_switch_interval = 2.0
idle_switch_jitter = 1.0

# 卡住检测：每隔该时长检查一次玩家位移，低于阈值视为撞墙/被阻挡
move_stuck_check_interval = 2.0
# 卡住判定阈值（像素）：检查周期内位移小于此值则换方向
move_stuck_threshold = 12
# 反向脱困后保持反方向的时长（秒），期间不被他处逻辑覆盖方向，
# 避免刚反向又被"朝怪物方向"逻辑立刻拉回墙边
stuck_reverse_hold_time = 2.0

# 补药冷却时间（秒），防止连续按
potion_cooldown = 2.0
# 喂食宠物间隔（秒），默认 20 分钟
feed_pet_interval = 1200.0

# 日志降频帧数：每 N 帧打印一次概况类日志
log_frame_interval = 60

# ------------------------------------------------------------------ #
#  [hpmp] HP/MP 监控参数
# ------------------------------------------------------------------ #

[hpmp]

# 血条区域（屏幕绝对坐标，需用 calibrate_hpmp.py 校准）
# 格式 [left, top, width, height]。机器/分辨率相关，游戏窗口移动/换设备后请重新校准。
# 注：以下坐标按「游戏窗口全屏 (0,0) 尺寸 2560x1600」实测标定。
hp_bar_region = [939, 1567, 204, 27]   # HP 血条（红填充，实测读 98%）
mp_bar_region = [1143, 1566, 202, 27]   # MP 血条（蓝填充，实测读 98%）

# 血条颜色范围（HSV）
hp_color_lower = [0, 80, 80]          # HP 红色下界（色相 0-10）
hp_color_upper = [10, 255, 255]
hp_color_lower2 = [170, 80, 80]       # HP 红色下界（色相 170-180）
hp_color_upper2 = [180, 255, 255]
mp_color_lower = [95, 80, 80]         # MP 蓝色下界（色相 95-130）
mp_color_upper = [130, 255, 255]

# HP/MP 百分比阈值（%），低于此值补药
hp_threshold = 50.0
mp_threshold = 50.0

# HP/MP 检查间隔（秒）
hp_mp_check_interval = 1.0

# HP/MP 分析截图开关；true 时每次检查保存 debug_hp*.png / debug_mp*.png 用于排查
save_hp_mp_debug = false

# ------------------------------------------------------------------ #
#  [window] 游戏窗口识别
# ------------------------------------------------------------------ #

[window]

# 识别游戏窗口的标题关键字（子串匹配，不区分大小写）。
# 留空则取面积最大的可见窗口。
# 用于抓图前把游戏窗口切到前台（避免抓到桌面/被遮挡窗口）。
game_window_keyword = "冒险岛"

# ------------------------------------------------------------------ #
#  [movement] 水平移动范围限制（仅对指定怪物分类生效）
# ------------------------------------------------------------------ #

[movement]

# 仅对以下怪物分类启用水平移动范围限制（对应 --monster 指定的分类名 /
# monster/ 下的子目录名）。例：["lvmogu"] 表示只有打绿蘑菇
# （--monster lvmogu）时才限制移动范围；留空 [] 表示全部关闭。
move_limit_enabled_categories = ["lvmogu"]

# 水平移动上限（像素）：玩家 X 相对机器人启动时的位置，向左或向右各最多
# 移动这么多像素（单侧 580px，总活动宽度 1160px），到达边界立即反向，
# 防止跑出固定挂机区域。
move_limit_pixels = 580

# 边界反向后保持反向移动的时长（秒）：期间不被他处逻辑
# （如朝怪物方向移动）覆盖方向。
move_limit_reverse_hold_time = 1.5
